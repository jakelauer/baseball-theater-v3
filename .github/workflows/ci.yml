name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            # The one gate (S62; law P11): lint, dup:check, test:coverage, build and
            # size — every law pnpm verify holds also holds here.
            - name: Verify
              run: pnpm verify

            - name: OpenAPI spec is up to date
              run: pnpm api:spec --check

            - name: No breaking API changes (oasdiff)
              run: pnpm api:breaking

            # Browsers run only here, never in pnpm verify (law P8).
            - name: Install the Playwright browser
              run: pnpm exec playwright install --with-deps chromium

            - name: Main flows (Playwright, fixtures)
              run: pnpm e2e

            # Budgets on the built app (ADR-026): LCP warns over 2.5 s and fails
            # at 5 s (owner, 2026-10-29); TBT and layout shift fail over budget.
            - name: Performance budgets (Lighthouse CI)
              run: pnpm lighthouse

            - name: Upload coverage summaries
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage
                  path: "**/coverage/coverage-summary.json"
                  if-no-files-found: ignore
